task: d1
project_name: openpi
wandb_enabled: true

vla:
  # A trained clean π0.5 checkpoint directory containing params/ and assets/.
  checkpoint: openpi/checkpoints
  config_name: pi05_d1
  # Used only by scripts/finetune.sh to create the first clean policy.
  output: checkpoints/vla
  base_checkpoint: models/openpi-assets/checkpoints/pi05_base/params
  dataset: dataset/pick_up_the_doll_and_place_it_on_the_plate
  prompt: Pick up the doll and place it on the plate
  inference_steps: 10
  action_horizon: 20
  model:
    pi05: true
    discrete_state_input: true
  finetune:
    enabled: true
    steps: 5000
    batch_size: 128
    save_interval: 1000
    keep_period: 15000
    num_workers: 8
    fsdp_devices: 4
    exp_name: dagger
    overwrite: true
    resume: false

dagger:
  rounds: 1
  episodes_per_round: 20
  intervention_ratio: 0.3
  intervention_dataset: checkpoints/dagger/interventions
  policy_output: checkpoints/dagger/policies
  state_file: checkpoints/dagger/state.json
